<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的厨房</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #c97b3a;
  --accent-h: #b5692c;
  --accent-light: #f5e8d8;
  --accent-subtle: rgba(201,123,58,0.08);
  --green: #5a8a5e;
  --green-bg: #e8f5e9;
  --purple: #7c6baa;
  --purple-bg: #f0ecf8;
  --orange-bg: #fef3e6;
  --red: #c0392b;
  --border: #e0d9ce;
  --border-light: #ede8e0;
  --text: #2c2520;
  --text2: #7a6f65;
  --text3: #b0a499;
  --sidebar-bg: rgba(240,235,226,0.96);
  --mid-bg: rgba(247,244,239,0.95);
  --card-bg: rgba(255,255,255,0.97);
  --item-bg: rgba(250,248,245,0.95);
}

body {
  font-family: -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background: #e8e2d5;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#bg-layer {
  position: fixed; inset: 0; z-index: 0;
  background: linear-gradient(135deg,#e8e2d5 0%,#d5ccbe 100%);
  background-size: cover; background-position: center;
  transition: opacity 0.4s;
}

.app {
  position: relative; z-index: 1;
  width: 1140px; max-width: 98vw;
  height: 92vh;
  border-radius: 18px;
  display: flex; overflow: hidden;
  box-shadow: 0 24px 80px rgba(0,0,0,0.2);
  background: rgba(250,248,245,0.9);
  backdrop-filter: blur(0px);
  -webkit-backdrop-filter: blur(0px);
  transition: backdrop-filter 0.4s, background 0.4s;
}
.app.glass {
  background: transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
.app.glass .sidebar { background: rgba(235,228,218,0.72); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
.app.glass .mid { background: rgba(245,241,234,0.62); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
.app.glass .right-panel { background: rgba(255,252,248,0.55); backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px); }
.app.glass .item-card { background: rgba(255,252,248,0.80); }
.app.glass .store-sec { background: rgba(255,252,248,0.80); }
.app.glass .modal { background: rgba(255,255,255,0.94); backdrop-filter: blur(20px); }
/* Readable text rows in glass mode */
.app.glass .ing-row { background: rgba(255,252,248,0.55); margin: 1px 6px; border-radius: 8px; }
.app.glass .rrow { background: rgba(255,252,248,0.55); margin: 1px 6px; border-radius: 8px; }
.app.glass .srow { background: rgba(255,252,248,0.50); margin: 1px 6px; border-radius: 8px; }
.app.glass .ing-row.on { background: rgba(201,123,58,0.18); }
.app.glass .rrow.on { background: rgba(201,123,58,0.18); }
.app.glass .srow.on { background: rgba(201,123,58,0.18); }
.app.glass .ing-row:hover { background: rgba(255,252,248,0.75); }
.app.glass .rrow:hover { background: rgba(255,252,248,0.75); }
/* Darker secondary text when glass is active */
.app.glass .ing-m,
.app.glass .rm,
.app.glass .sc,
.app.glass .mid-subtitle,
.app.glass .ifreq,
.app.glass .inote { color: #6a5e55; }
.app.glass .rfrow { background: rgba(255,252,248,0.45); }
/* Recipe detail text in glass mode */
.app.glass .rdet-meta { color: #5a5048; font-weight: 500; }
.app.glass .sec-t { color: #7a6a5e; font-weight: 600; }
.app.glass .itag { background: rgba(245,240,230,0.88); color: #3a2e28; border: 1px solid rgba(160,130,100,0.3); }
.app.glass .itag.opt { background: rgba(230,225,220,0.80); color: #6a5e55; }
.app.glass .stag { background: rgba(230,224,242,0.88); color: #4a3878; border: 1px solid rgba(130,100,160,0.3); }
.app.glass .stag.opt { background: rgba(224,220,228,0.80); color: #6a5e6a; }
.app.glass .store-sec { background: rgba(255,252,248,0.80); border-color: rgba(200,185,165,0.5); }
.app.glass .rdet-body .det-name,
.app.glass .rdet-name { color: #2c2520; }
.app.glass .chip { background: rgba(250,246,240,0.88); color: #4a3e38; border-color: rgba(200,185,165,0.4); }
.app.glass .det-body .sec-t { color: #7a6a5e; font-weight: 600; }
.app.glass .badge { opacity: 0.95; }

/* ── SIDEBAR ── */
.sidebar {
  width: 186px; min-width: 186px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: background 0.4s;
}
.logo-area {
  display: flex; align-items: center; gap: 10px;
  padding: 22px 18px 16px;
}
.logo-icon {
  width: 38px; height: 38px;
  background: var(--accent); border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(201,123,58,0.4);
}
.logo-name { font-size: 15px; font-weight: 700; color: var(--text); }
.sec-label { font-size: 10.5px; color: var(--text3); letter-spacing: 0.07em; padding: 6px 18px 5px; }
.nav {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 18px; font-size: 13.5px;
  color: var(--text2); cursor: pointer;
  border-left: 3px solid transparent;
  transition: background 0.15s, color 0.15s;
  user-select: none;
}
.nav:hover { background: rgba(0,0,0,0.04); color: var(--text); }
.nav.on { color: var(--text); font-weight: 600; border-left-color: var(--accent); background: var(--accent-subtle); }
.nav-icon { font-size: 16px; }
.sidebar-foot {
  margin-top: auto;
  border-top: 1px solid var(--border);
  padding: 12px 18px;
  font-size: 11px; color: var(--text3); line-height: 1.95;
}
.foot-btn {
  display: flex; align-items: center; gap: 5px;
  background: none; border: none; font-family: inherit;
  font-size: 11px; color: var(--text3); cursor: pointer;
  padding: 1px 0; transition: color 0.15s;
}
.foot-btn:hover { color: var(--accent); }
.foot-btn.danger:hover { color: var(--red); }
.status-row { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
.sdot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); display: inline-block; margin-right: 4px; vertical-align: middle; }
.sdot.ok { background: var(--green); }

/* ── MID PANEL ── */
.mid {
  width: 218px; min-width: 218px;
  background: var(--mid-bg);
  border-right: 1px solid var(--border-light);
  display: flex; flex-direction: column;
  overflow: hidden; transition: background 0.4s;
}
.mid-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 14px 12px;
  border-bottom: 1px solid var(--border-light);
  flex-shrink: 0;
}
.mid-title { font-size: 14.5px; font-weight: 600; color: var(--text); }
.mid-subtitle { font-size: 12.5px; color: var(--text3); font-weight: 400; }
.plus-btn {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--accent-light); border: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; color: var(--accent); cursor: pointer;
  transition: background 0.15s;
}
.plus-btn:hover { background: var(--accent); color: white; }

/* Ingredient tabs */
.ing-tabs { display: flex; border-bottom: 1px solid var(--border-light); flex-shrink: 0; }
.itab {
  flex: 1; text-align: center; padding: 8px 4px;
  font-size: 12.5px; color: var(--text2); cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s; user-select: none;
}
.itab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.itab-n { font-size: 11px; color: var(--text3); margin-left: 2px; }

/* Recipe filter rows */
.rfrow {
  display: flex; gap: 6px; padding: 7px 10px;
  flex-wrap: nowrap; overflow-x: auto;
  border-bottom: 1px solid var(--border-light); flex-shrink: 0;
  scrollbar-width: none;
}
.rfrow::-webkit-scrollbar { display: none; }
.rfrow:last-child { border-bottom: none; }
.rtag {
  padding: 5px 12px; border-radius: 99px; white-space: nowrap;
  font-size: 12px; cursor: pointer; user-select: none;
  border: 1.5px solid rgba(160,140,120,0.45); color: var(--text2);
  transition: all 0.12s; background: rgba(255,255,255,0.35);
  flex-shrink: 0;
}
.rtag.on { background: var(--accent); border-color: var(--accent); color: white; }
.rtag:hover:not(.on) { border-color: var(--accent); color: var(--accent); background: rgba(201,123,58,0.08); }

/* Scrollable list areas */
.scroll { flex: 1; overflow-y: auto; }
.scroll::-webkit-scrollbar { width: 4px; }
.scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

/* Ingredient item */
.ing-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; cursor: pointer;
  border-left: 3px solid transparent; transition: background 0.12s;
}
.ing-row:hover { background: rgba(0,0,0,0.04); }
.ing-row.on { background: var(--accent-subtle); border-left-color: var(--accent); }
.ing-thumb {
  width: 38px; height: 38px; border-radius: 9px;
  background: rgba(240,235,226,0.9);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0;
}
.ing-info { flex: 1; min-width: 0; }
.ing-n-row { display: flex; align-items: center; gap: 5px; }
.idot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.ing-n { font-size: 13.5px; font-weight: 500; color: var(--text); }
.ing-m { font-size: 11px; color: var(--text3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Recipe list item */
.rrow {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px; cursor: pointer;
  border-left: 3px solid transparent; transition: background 0.12s;
}
.rrow:hover { background: rgba(0,0,0,0.04); }
.rrow.on { background: var(--accent-subtle); border-left-color: var(--accent); }
.rthumb {
  width: 42px; height: 42px; border-radius: 10px;
  background: rgba(240,235,226,0.9);
  display: flex; align-items: center; justify-content: center;
  font-size: 21px; flex-shrink: 0; overflow: hidden;
}
.rthumb img { width: 100%; height: 100%; object-fit: cover; }
.rn { font-size: 13.5px; font-weight: 500; color: var(--text); }
.rm { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* Store list items */
.srow {
  padding: 12px 16px; cursor: pointer;
  border-left: 3px solid transparent; transition: background 0.12s;
}
.srow:hover { background: rgba(0,0,0,0.04); }
.srow.on { background: rgba(201,123,58,0.1); border-left-color: var(--accent); }
.sn { font-size: 14px; font-weight: 500; color: var(--text); }
.srow.on .sn { color: var(--accent); }
.sc { font-size: 12px; color: var(--text3); margin-top: 2px; }

/* ── RIGHT PANEL ── */
.right-panel {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden; background: var(--card-bg);
  transition: background 0.4s;
}

/* Placeholder */
.ph {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--text3); gap: 10px;
}
.ph-icon { font-size: 44px; opacity: 0.3; }
.ph-text { font-size: 14px; }

/* Shopping panel */
.rp-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 19px 26px 13px; border-bottom: 1px solid var(--border-light); flex-shrink: 0;
}
.rp-title { display: flex; align-items: center; gap: 8px; font-size: 16.5px; font-weight: 600; }
.icon-act {
  padding: 5px 12px; border: 1px solid var(--border); border-radius: 7px;
  font-size: 12px; color: var(--text2); cursor: pointer;
  background: none; font-family: inherit; transition: all 0.12s;
}
.icon-act:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
.icon-act.del:hover { background: #fff0f0; color: var(--red); border-color: #f5c0c0; }

.prog-wrap { padding: 0 26px 12px; flex-shrink: 0; }
.prog-meta { text-align: right; font-size: 12px; color: var(--text3); margin-bottom: 5px; }
.prog-track { height: 4px; background: #e8e2d8; border-radius: 99px; overflow: hidden; }
.prog-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.35s ease; }

.item-list { flex: 1; overflow-y: auto; padding: 0 18px 18px; }
.item-list::-webkit-scrollbar { width: 5px; }
.item-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

.grp-head {
  display: flex; align-items: center; gap: 7px;
  padding: 13px 8px 7px; font-size: 11.5px;
  color: var(--text3); font-weight: 500;
}
.gdot { width: 7px; height: 7px; border-radius: 50%; }

.item-card {
  background: var(--item-bg); border: 1px solid var(--border-light);
  border-radius: 10px; padding: 12px 16px;
  margin-bottom: 7px;
  display: flex; align-items: flex-start; gap: 12px;
  cursor: pointer; transition: background 0.12s, opacity 0.2s;
  user-select: none;
}
.item-card:hover { border-color: var(--border); }
.item-card.ck { opacity: 0.5; }
.cb {
  width: 21px; height: 21px; border: 1.5px solid var(--border);
  border-radius: 6px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  margin-top: 1px; transition: all 0.15s;
}
.item-card.ck .cb { background: var(--accent); border-color: var(--accent); }
.chk { display: none; }
.item-card.ck .chk { display: block; }
.iname { font-size: 14px; font-weight: 500; color: var(--text); }
.item-card.ck .iname { text-decoration: line-through; color: var(--text3); }
.inote { font-size: 12px; color: var(--text2); margin-top: 3px; }
.ifreq { font-size: 11px; color: var(--text3); margin-top: 2px; }

.add-bar {
  padding: 10px 16px; border-top: 1px solid var(--border-light);
  display: flex; gap: 7px; flex-shrink: 0;
}
.ai {
  flex: 1; border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; font-size: 13.5px; font-family: inherit;
  background: rgba(250,248,245,0.9); color: var(--text);
  outline: none; transition: border-color 0.15s;
}
.ai:focus { border-color: var(--accent); }
.ai::placeholder { color: var(--text3); }
.add-btn {
  background: var(--accent); color: #fff;
  border: none; border-radius: 8px;
  padding: 8px 16px; font-size: 13.5px;
  font-family: inherit; cursor: pointer; font-weight: 500;
  transition: background 0.12s;
}
.add-btn:hover { background: var(--accent-h); }

/* ── INGREDIENT DETAIL ── */
.ing-det { flex: 1; overflow-y: auto; }
.ing-det::-webkit-scrollbar { width: 5px; }
.ing-det::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
.det-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 26px 14px; border-bottom: 1px solid var(--border-light); flex-shrink: 0;
}
.det-body { padding: 22px 26px 32px; }
.det-big-icon {
  width: 68px; height: 68px; border-radius: 18px;
  background: var(--item-bg); display: flex;
  align-items: center; justify-content: center;
  font-size: 34px; margin-bottom: 14px;
}
.det-name { font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.badge {
  display: inline-flex; align-items: center;
  padding: 3px 12px; border-radius: 99px;
  font-size: 12px; font-weight: 500; margin-bottom: 20px;
}
.badge.long { background: var(--purple-bg); color: var(--purple); }
.badge.short { background: var(--green-bg); color: var(--green); }
.badge.meal { background: #f5ede0; color: #a06020; }
.badge.break { background: #e8f4f8; color: #3a7a9b; }
.badge.brunch { background: #e8f5e9; color: #3a7a5a; }
.badge.dessert { background: #f9e8f0; color: #9b3a6e; }
.badge.late { background: #eee8f5; color: #6a3a9b; }

.sec-t { font-size: 11.5px; color: var(--text3); font-weight: 500; letter-spacing: 0.04em; margin-bottom: 9px; }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.chip {
  padding: 6px 13px; background: var(--item-bg);
  border-radius: 8px; font-size: 13px; color: var(--text2);
  border: 1px solid var(--border-light);
}
.chip.link { cursor: pointer; transition: background 0.12s; }
.chip.link:hover { background: var(--accent-light); color: var(--accent); }

/* ── RECIPE DETAIL ── */
.rdet { flex: 1; overflow-y: auto; }
.rdet::-webkit-scrollbar { width: 5px; }
.rdet::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
.rimg-area {
  height: 210px; flex-shrink: 0; position: relative;
  background: #f0ece6; display: flex;
  align-items: center; justify-content: center; overflow: hidden;
}
.rimg-area img { width: 100%; height: 100%; object-fit: cover; }
.rimg-ph { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--text3); font-size: 13px; }
.rimg-ph-icon { font-size: 36px; opacity: 0.3; }
.rimg-btn {
  position: absolute; bottom: 12px; right: 12px;
  background: rgba(20,15,10,0.58); color: #fff;
  border: none; border-radius: 8px;
  padding: 6px 14px; font-size: 12.5px;
  cursor: pointer; font-family: inherit;
  transition: background 0.12s;
}
.rimg-btn:hover { background: rgba(0,0,0,0.75); }
.rdet-body { padding: 20px 26px 32px; }
.rdet-title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 3px; }
.rdet-name { font-size: 22px; font-weight: 700; color: var(--text); }
.rdet-meta { font-size: 13px; color: var(--text3); margin-bottom: 18px; display: flex; align-items: center; gap: 6px; }
.act-row { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 14px; }

.itags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }
.itag {
  padding: 5px 13px; border-radius: 99px;
  font-size: 12.5px; background: #f5f0e6; color: var(--text2);
}
.itag.opt { background: #f0f0f0; color: var(--text3); }
.itag .iamt { opacity: 0.75; font-size: 11.5px; }

.store-sec {
  background: var(--item-bg); border: 1px solid var(--border-light);
  border-radius: 10px; padding: 13px 16px; margin-bottom: 9px;
}
.store-sec-h {
  display: flex; align-items: center; gap: 8px;
  font-size: 13.5px; font-weight: 500; color: var(--text); margin-bottom: 10px;
}
.fresh-badge {
  font-size: 10.5px; padding: 2px 8px; border-radius: 99px;
  background: #e8f5e9; color: var(--green);
}
.store-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.stag {
  padding: 4px 11px; border-radius: 99px;
  font-size: 12px; background: var(--purple-bg); color: var(--purple);
}
.stag.opt { background: #f0f0f0; color: var(--text3); }
.stag .sopt { font-size: 10px; opacity: 0.75; }

.steps-ul { list-style: none; }
.step-li { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
.step-li:last-child { border-bottom: none; }
.snum {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--accent); color: white;
  font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px;
}
.stxt { font-size: 13.5px; color: var(--text2); line-height: 1.65; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.45);
  display: flex; align-items: center; justify-content: center;
}
.modal {
  background: white; border-radius: 16px;
  padding: 28px 32px; width: 480px; max-width: 95vw;
  box-shadow: 0 24px 60px rgba(0,0,0,0.25);
}
.modal-title { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 20px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; color: var(--text3); margin-bottom: 5px; }
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--border); border-radius: 8px;
  padding: 9px 12px; font-size: 13.5px; font-family: inherit;
  color: var(--text); background: var(--item-bg); outline: none;
  transition: border-color 0.15s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 80px; }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }
.modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.mbtn {
  padding: 9px 20px; border-radius: 8px; font-size: 13.5px;
  font-family: inherit; cursor: pointer; font-weight: 500;
  transition: all 0.12s;
}
.mbtn.cancel { background: var(--item-bg); border: 1px solid var(--border); color: var(--text2); }

async function loadFromCloud() {
  if (!sb) return false;
  try {
    const { data, error } = await sb.from('kitchen_data').select('data').eq('id','main').single();
    if (error || !data) return false;
    S = { ...JSON.parse(JSON.stringify(DEF)), ...data.data };
    return true;
  } catch(e) { return false; }
}

async function saveToCloud() {
  if (!sb) return;
  try {
    await sb.from('kitchen_data').upsert({ id: 'main', data: S, updated_at: new Date().toISOString() });
    setSyncStatus('ok');
  } catch(e) { setSyncStatus('err'); }
}

function save() {
  // Always save to localStorage as backup
  try { localStorage.setItem('kitchen_local', JSON.stringify(S)); } catch(e) {}
  if (!sb) return;
  setSyncStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToCloud, 800);
}

function setSyncStatus(state) {
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-txt');
  if (!dot) return;
  if (state === 'ok')     { dot.style.background='#5a8a5e'; txt.textContent='已同步'; }
  if (state === 'saving') { dot.style.background='#c97b3a'; txt.textContent='同步中…'; }
  if (state === 'err')    { dot.style.background='#c0392b'; txt.textContent='同步失败'; }
  if (state === 'local')  { dot.style.background='#b0a499'; txt.textContent='本地模式'; }
}

function startRealtime() {
  if (!sb) return;
  try {
    if (syncChannel) syncChannel.unsubscribe();
    syncChannel = sb.channel('kitchen-changes')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'kitchen_data' }, async () => {
        const ok = await loadFromCloud();
        if (ok) { applyBg(); go(S.view || 'recipes'); }
      })
      .subscribe();
  } catch(e) {}
}

function checkSavedLogin() {
  return localStorage.getItem('kitchen_auth') === 'ok';
}

function doLogin() {
  const pwd = document.getElementById('gate-pwd').value.trim();
  const err = document.getElementById('gate-err');
  if (!pwd) { err.textContent = '请输入密码'; return; }
  if (pwd !== PASSWORD) {
    err.textContent = '密码错误，请重试';
    document.getElementById('gate-pwd').select();
    return;
  }
  localStorage.setItem('kitchen_auth', 'ok');
  enterApp();
}

function doLogout() {
  if (!confirm('确定退出？下次需要重新输入密码')) return;
  localStorage.removeItem('kitchen_auth');
  location.reload();
}

function enterApp() {
  // Always start with default data so there's something to see
  S = JSON.parse(JSON.stringify(DEF));

  // Try to restore from localStorage backup (instant, no network)
  try {
    const local = localStorage.getItem('kitchen_local');
    if (local) {
      const parsed = JSON.parse(local);
      if (parsed && parsed.ingredients) S = { ...S, ...parsed };
    }
  } catch(e) {}

  // Show app immediately with whatever data we have
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  applyBg();
  go(S.view || 'recipes');
  setSyncStatus('saving');

  // Sync with cloud in background
  loadFromCloud().then(ok => {
    if (ok) {
      applyBg(); go(S.view || 'recipes'); setSyncStatus('ok');
      startRealtime();
    } else {
      // First time or offline — push default data to cloud
      saveToCloud().catch(()=>{});
      setSyncStatus('err');
    }
  }).catch(() => setSyncStatus('err'));
}

function uploadBg(e) {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(), u = URL.createObjectURL(f);
  img.onload = () => {
    const c = document.createElement('canvas');
    let w = img.width, h = img.height, MAX = 1920;
    if (w > MAX) { h = Math.round(h*MAX/w); w = MAX; }
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    S.bgImage = c.toDataURL('image/jpeg', 0.82);
    URL.revokeObjectURL(u); save(); applyBg();
  };
  img.src = u; e.target.value = '';
}
function clearBg() { S.bgImage = null; save(); applyBg(); }
function applyBg() {
  const bl = document.getElementById('bg-layer');
  const btn = document.getElementById('clear-bg-btn');
  const app = document.getElementById('app');
  if (S.bgImage) {
    bl.style.backgroundImage = `url(${S.bgImage})`;
    bl.style.background = `url(${S.bgImage}) center/cover no-repeat`;
    app.classList.add('glass');
    btn.style.display = 'flex';
  } else {
    bl.style.background = 'linear-gradient(135deg,#e8e2d5 0%,#d5ccbe 100%)';
    app.classList.remove('glass');
    btn.style.display = 'none';
  }
}

const BADGE_CLASSES = {正餐:'meal',早餐:'break',Brunch:'brunch',甜品:'dessert',宵夜:'late'};

function renderRecipes() {

  const fr = document.getElementById('recipe-filter-rows');
  fr.innerHTML = `
    <div class="rfrow">${MEAL_TYPES.map(t=>`<div class="rtag${S.rfType===t?' on':''}" onclick="setRF('type','${t}')">${t}</div>`).join('')}</div>

  // Recipe list
  const filtered = S.recipes.filter(r => {
    const tok = S.rfType==='全部'||r.mealType===S.rfType;
    const cok = S.rfCuisine==='全部'||r.cuisine===S.rfCuisine||r.cuisine.includes(S.rfCuisine);
    return tok && cok;
  });
  document.getElementById('recipe-count-txt').textContent = ` (${filtered.length}/${S.recipes.length})`;
  const wrap = document.getElementById('recipe-rows');
  wrap.innerHTML = '';

    el.className = 'rrow' + (S.activeRecipeId===r.id?' on':'');

    el.innerHTML = `${thumb}<div><div class="rn">${r.name}</div><div class="rm">${r.cuisine}·${r.mealType}·${r.time}分钟</div></div>`;
    el.onclick = () => { S.activeRecipeId = r.id; save(); renderRecipes(); renderRecipeDetail(); };
    wrap.appendChild(el);
  });
  renderRecipeDetail();
}

function setRF(k, v) {
  if (k==='type') S.rfType = v; else S.rfCuisine = v;
  save(); renderRecipes();
}

function renderRecipeDetail() {
  const panel = document.getElementById('right');
  if (!S.activeRecipeId) {
    panel.innerHTML = `<div class="ph"><div class="ph-icon">📖</div><div class="ph-text">选择菜谱查看详情</div></div>`;
    return;
  }
  const r = S.recipes.find(r=>r.id===S.activeRecipeId);
  if (!r) { panel.innerHTML = `<div class="ph"><div class="ph-icon">📖</div><div class="ph-text">选择菜谱查看详情</div></div>`; return; }

  // Store grouping
  const sm = {};
  r.ingredients.forEach(i => { if (!sm[i.store]) sm[i.store] = []; sm[i.store].push(i); });
  const storeSecs = Object.entries(sm).map(([st, ings]) => {
    const hasFresh = ings.some(i => { const d = S.ingredients.find(x=>x.name===i.name); return d&&d.type==='short'; });
    const tags = ings.map(i=>`<div class="stag${i.opt?' opt':''}">${i.name} <span class="sopt">${i.amount}${i.opt?' 可选':''}</span></div>`).join('');
    return `<div class="store-sec"><div class="store-sec-h"><span>🛒</span>${st}${hasFresh?'<span class="fresh-badge">含生鲜</span>':''}</div><div class="store-tags">${tags}</div></div>`;
  }).join('');

  const allTags = r.ingredients.map(i=>`<div class="itag${i.opt?' opt':''}">${i.name} <span class="iamt">${i.amount}${i.opt?' 可选':''}</span></div>`).join('');
  const steps = r.steps.map((s,i)=>`<li class="step-li"><div class="snum">${i+1}</div><div class="stxt">${s}</div></li>`).join('');
  const bc = BADGE_CLASSES[r.mealType] || 'meal';
  const imgHtml = r.image ? `<img src="${r.image}">` : `<div class="rimg-ph"><div class="rimg-ph-icon">🍽</div><span>点击右下角添加图片</span></div>`;

  panel.innerHTML = `
    <div class="rdet">
      <div style="display:flex;flex-direction:column;height:100%;overflow:hidden;">
        <div class="rimg-area" style="flex-shrink:0;">${imgHtml}
          <button class="rimg-btn" onclick="trigRImg(${r.id})">+ 添加图片</button>
        </div>
        <div style="flex:1;overflow-y:auto;" class="rdet-inner">
          <div class="rdet-body">
            <div class="act-row">
              <button class="icon-act" onclick="openEditRecipe(${r.id})">✏️ 编辑</button>
              <button class="icon-act del" onclick="delRecipe(${r.id})">🗑</button>
            </div>
            <div class="rdet-title-row">
              <div class="rdet-name">${r.name}</div>
              <div class="badge ${bc}">${r.mealType}</div>
            </div>
            <div class="rdet-meta">${r.cuisine} · <span>⏱ ${r.time}分钟</span></div>
            <div class="sec-t">所需原料</div>
            <div class="itags">${allTags}</div>
            <div class="sec-t">需要去哪里买</div>
            ${storeSecs}
            <div class="sec-t" style="margin-top:20px;">烹饪步骤</div>
            <ul class="steps-ul">${steps}</ul>
          </div>
        </div>
      </div>
    </div>`;

  // Fix inner scroll height
  const rdet = panel.querySelector('.rdet');
  if (rdet) rdet.style.cssText = 'flex:1;overflow:hidden;display:flex;flex-direction:column;';
}

function trigRImg(id) {
  document.getElementById('rimg-inp').dataset.rid = id;
  document.getElementById('rimg-inp').click();
}
function onRecipeImg(e) {
  const id = parseInt(document.getElementById('rimg-inp').dataset.rid);
  const f = e.target.files[0]; if (!f||!id) return;
  const img = new Image(), u = URL.createObjectURL(f);
  img.onload = () => {
    const c = document.createElement('canvas');
    let w = img.width, h = img.height, MAX = 900;
    if (w > MAX) { h = Math.round(h*MAX/w); w = MAX; }
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    const r = S.recipes.find(r=>r.id===id); if (!r) return;
    r.image = c.toDataURL('image/jpeg', 0.82);
    URL.revokeObjectURL(u); save();
    renderRecipes(); renderRecipeDetail();
  };
  img.src = u; e.target.value = '';
}

// ────────────────────────────────────
//  Ingredient row helper (for recipe modals)
// ────────────────────────────────────
function addIngRow(listId, ing) {
  const list = document.getElementById(listId);
  // Add header if first row
  if (list.children.length === 0) {
    const h = document.createElement('div');
    h.className = 'ing-row-head';
    h.innerHTML = '<span>原料名称</span><span>用量</span><span>购买地点</span><span>可选</span><span></span>';
    list.appendChild(h);
  }
  const row = document.createElement('div');
  row.className = 'ing-row-entry';
  const storeOpts = ["Trader Joe's","Whole Foods","99大华"].map(s =>
    `<option value="${s}"${ing&&ing.store===s?' selected':''}>${s}</option>`).join('');
  row.innerHTML = `
    <input type="text" placeholder="例：番茄" value="${ing?ing.name:''}">
    <input type="text" placeholder="2个" value="${ing?ing.amount:''}">
    <select>${storeOpts}</select>
    <select>
      <option value="false"${ing&&!ing.opt?' selected':''}>必须</option>
      <option value="true"${ing&&ing.opt?' selected':''}>可选</option>
    </select>
    <button class="ing-row-del" type="button" onclick="this.parentElement.remove();cleanIngHead('${listId}')">×</button>`;
  list.appendChild(row);
}

function cleanIngHead(listId) {
  const list = document.getElementById(listId);
  // Remove header if no data rows left
  if (list.querySelectorAll('.ing-row-entry').length === 0) list.innerHTML = '';
}

function readIngRows(listId) {
  return Array.from(document.querySelectorAll(`#${listId} .ing-row-entry`)).map(row => {
    const inputs = row.querySelectorAll('input,select');
    return {
      name: inputs[0].value.trim(),
      amount: inputs[1].value.trim() || '适量',
      store: inputs[2].value,
      opt: inputs[3].value === 'true'
    };
  }).filter(i => i.name);
}

// ────────────────────────────────────

function addRecipe() {
  const name = document.getElementById('mr-name').value.trim(); if (!name) return;
  const r = {
    id: nid++, name,
    cuisine: document.getElementById('mr-cuisine').value,
    mealType: document.getElementById('mr-meal').value,
    time: parseInt(document.getElementById('mr-time').value)||30,
    image: null,
    ingredients: readIngRows('mr-ing-list'),
    steps: document.getElementById('mr-steps').value.split('\n').map(s=>s.trim()).filter(Boolean)
  };
  S.recipes.push(r); S.activeRecipeId = r.id;
  save(); closeModal(); renderRecipes();
}

function openEditRecipe(id) {
  const r = S.recipes.find(r=>r.id===id); if (!r) return;
  document.getElementById('er-id').value = id;
  document.getElementById('er-name').value = r.name;
  document.getElementById('er-cuisine').value = r.cuisine;
  document.getElementById('er-meal').value = r.mealType;
  document.getElementById('er-time').value = r.time;
  document.getElementById('er-steps').value = r.steps.join('\n');
  // Populate ingredient rows
  const list = document.getElementById('er-ing-list');
  list.innerHTML = '';
  (r.ingredients||[]).forEach(ing => addIngRow('er-ing-list', ing));
  openModal('edit-recipe');
}
function saveRecipeEdit() {
  const id = parseInt(document.getElementById('er-id').value);
  const r = S.recipes.find(r=>r.id===id); if (!r) return;
  r.name = document.getElementById('er-name').value.trim() || r.name;
  r.cuisine = document.getElementById('er-cuisine').value;
  r.mealType = document.getElementById('er-meal').value;
  r.time = parseInt(document.getElementById('er-time').value) || r.time;
  r.ingredients = readIngRows('er-ing-list');
  r.steps = document.getElementById('er-steps').value.split('\n').map(s=>s.trim()).filter(Boolean);
  save(); closeModal(); renderRecipes(); renderRecipeDetail();
}

// Clear ingredient rows when opening add modal
function openAddRecipeModal() {
  document.getElementById('mr-name').value = '';
  document.getElementById('mr-time').value = '20';
  document.getElementById('mr-steps').value = '';
  document.getElementById('mr-ing-list').innerHTML = '';
  openModal('add-recipe');
}

function delRecipe(id) {
  if (!confirm('确定删除这个菜谱？')) return;
  S.recipes = S.recipes.filter(r=>r.id!==id);
  S.activeRecipeId = null; save(); renderRecipes();
}

// ════════════════════════════════════
//  SHOPPING — dynamic from ingredients
// ════════════════════════════════════
const STORES = ["Trader Joe's", "Whole Foods", "99大华"];

function renderShopping() {
  // Init checked state if missing
  if (!S.shoppingChecked) S.shoppingChecked = {};

  // Group ingredients by store
  const byStore = {};
  STORES.forEach(s => byStore[s] = []);
  S.ingredients.forEach(ing => {
    if (byStore[ing.store] !== undefined) byStore[ing.store].push(ing);
  });

  // Store list
  const sw = document.getElementById('store-rows');
  sw.innerHTML = '';
  STORES.forEach(stName => {
    const count = byStore[stName].length;
    const el = document.createElement('div');
    el.className = 'srow' + (S.activeStoreId===stName?' on':'');
    el.innerHTML = `<div class="sn">${stName}</div><div class="sc">${count} 件</div>`;
    el.onclick = () => { S.activeStoreId = stName; save(); renderShopping(); };
    sw.appendChild(el);
  });

  // Items for active store
  const activeStore = S.activeStoreId || STORES[0];
  const items = byStore[activeStore] || [];
  let ck = items.filter(i => S.shoppingChecked[i.id]).length;
  const tot = items.length;
  const pct = tot ? Math.round((ck/tot)*100) : 0;

  document.getElementById('right').innerHTML = `
    <div style="display:flex;flex-direction:column;height:100%;overflow:hidden;">
      <div class="rp-head">
        <div class="rp-title"><span>🛒</span>${activeStore}</div>
        <button class="icon-act" onclick="clearStoreChecked()">清空勾选</button>
      </div>
      <div class="prog-wrap">
        <div class="prog-meta">${ck}/${tot}</div>
        <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="item-list" id="item-list-inner"></div>
    </div>`;

  const inner = document.getElementById('item-list-inner');
  if (items.length === 0) {
    inner.innerHTML = `<div class="ph"><div class="ph-icon">🛒</div><div class="ph-text">这家店还没有原料</div><div style="font-size:12px;color:var(--text3);margin-top:6px;">在「原料」页面添加并选择购买地点</div></div>`;
    return;
  }

  // Separate by type
  const fresh = items.filter(i => i.type === 'short');
  const pantry = items.filter(i => i.type === 'long');

  function renderGroup(label, groupItems, dotColor) {
    if (groupItems.length === 0) return;
    const h = document.createElement('div');
    h.className = 'grp-head';
    h.innerHTML = `<div class="gdot" style="background:${dotColor}"></div><span>${label}（${groupItems.length}件）</span>`;
    inner.appendChild(h);
    groupItems.forEach(ing => {
      const checked = !!S.shoppingChecked[ing.id];
      const c = document.createElement('div');
      c.className = 'item-card' + (checked ? ' ck' : '');
      c.innerHTML = `
        <div class="cb">
          <svg class="chk" width="12" height="9" viewBox="0 0 12 9" fill="none">
            <path d="M1.5 4.5L4.5 7.5L10.5 1.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <div class="iname">${ing.icon} ${ing.name}</div>
          ${ing.freq ? `<div class="ifreq">${ing.freq}</div>` : ''}
        </div>`;
      c.onclick = () => {
        S.shoppingChecked[ing.id] = !S.shoppingChecked[ing.id];
        save(); renderShopping();
      };
      inner.appendChild(c);
    });
  }

  renderGroup('新鲜食材', fresh, '#5a8a5e');
  renderGroup('长期储备', pantry, '#7c6baa');
}

function clearStoreChecked() {
  const activeStore = S.activeStoreId || STORES[0];
  S.ingredients.filter(i => i.store === activeStore).forEach(i => {
    S.shoppingChecked[i.id] = false;
  });
  save(); renderShopping();
}

// ════════════════════════════════════
//  MODAL
// ════════════════════════════════════
let currentModal = null;
function openModal(name) {
  document.getElementById('modal-overlay').style.display = 'flex';
  ['add-ing','edit-ing','add-recipe','edit-recipe'].forEach(id => {
    document.getElementById('modal-'+id).style.display = id===name?'block':'none';
  });
  currentModal = name;
}
function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').style.display = 'none';
  currentModal = null;
}
document.addEventListener('keydown', e => { if (e.key==='Escape') { document.getElementById('modal-overlay').style.display='none'; } });
