<!DOCTYPE html>

<title>每日买菜助手 · Amorize</title>
<style>
:root { --green: #2e7d4f; --bg: #f7f6f3; --text: #2b2b28; --muted: #8a877f; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
h1 { font-size: 26px; font-weight: 700; margin-top: 18px; }
.date { font-size: 15px; color: var(--muted); margin-top: 10px; }
.note { font-size: 13px; color: var(--muted); margin-top: 26px; }
svg { width: 170px; height: auto; }
footer { position: fixed; bottom: 18px; font-size: 12px; color: var(--muted); }
</style>
</head>

<h1>🛒 每日买菜助手</h1>
<div class="date" id="today"></div>
<div class="note">正在一点点搭建中</div>
<footer>Amorize LLC</footer>
<script>
var d = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Shanghai" }));
var week = ["日","一","二","三","四","五","六"];
document.getElementById("today").textContent = (d.getMonth()+1) + "月" + d.getDate() + "日 星期" + week[d.getDay()] + " · 北京时间";
</script>
