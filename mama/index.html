<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>每日买菜助手 · Amorize</title>
<style>
:root { --green: #a3b18a; --green-dark: #869873; --bg: #f7f6f3; --text: #2b2b28; --muted: #8a877f; --border: #e8e6e0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
h1 { font-size: 26px; font-weight: 700; margin-top: 18px; }
.date { font-size: 15px; color: var(--muted); margin-top: 10px; }
.note { font-size: 13px; color: var(--muted); margin-top: 26px; }
svg { width: 195px; height: auto; }
footer { position: fixed; bottom: 18px; font-size: 12px; color: var(--muted); }
#stage { transform: translateY(-8vh); }
#lock { margin-top: 30px; display: flex; gap: 10px; justify-content: center; }
#pw { width: 180px; padding: 12px 14px; font-size: 16px; text-align: center; border: 1px solid var(--border); border-radius: 12px; background: #fff; outline: none; letter-spacing: 2px; }
#pw:focus { border-color: var(--green); }
#go { width: 46px; padding: 12px 0; color: #fff; background: var(--green); border: 0; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
#go svg { width: 20px; height: 20px; }
#go:active { background: var(--green-dark); }
.shake { animation: shake .4s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)} 40%{transform:translateX(9px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="stage">
<svg viewBox="0 0 220 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<path d="M60 60 L160 60 L172 138 Q172 144 166 144 L54 144 Q48 144 48 138 Z" fill="#e7cfa5"/>
<path d="M60 60 L160 60 L163 80 L57 80 Z" fill="#dbbf8e"/>
<ellipse cx="78" cy="52" rx="16" ry="22" fill="#bfe3a0"/>
<path d="M70 34 Q78 48 74 70 M86 34 Q80 48 84 70" stroke="#8cc063" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle cx="112" cy="50" r="15" fill="#e8604c"/>
<path d="M112 36 l-4 -6 M112 36 l4 -6 M112 36 l0 -8" stroke="#4d8b4d" stroke-width="3" stroke-linecap="round"/>
<path d="M142 30 Q152 52 146 62 Q138 54 134 34 Z" fill="#ef9440"/>
<path d="M140 28 l-6 -8 M142 28 l2 -10 M144 30 l8 -6" stroke="#5da356" stroke-width="3" stroke-linecap="round"/>
<path d="M158 58 Q178 34 186 26 Q192 32 188 40 Q176 56 164 66 Z" fill="#d9a35c"/>
<path d="M170 48 l6 4 M176 41 l6 4" stroke="#b97f3c" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="97" cy="108" r="3" fill="#8a6a3f"/>
<circle cx="123" cy="108" r="3" fill="#8a6a3f"/>
<path d="M96 120 Q110 130 124 120" stroke="#8a6a3f" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
<div id="lock">
<input type="password" id="pw" autocomplete="off">
<button id="go" aria-label="进入"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12h15M13 6l6 6-6 6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>
<div id="main" hidden>
<div class="date" id="today"></div>
<div class="note">正在一点点搭建中</div>
</div>
</div>
<footer>Amorize LLC</footer>
<script>
var KEY = "1a2nw1x";
function hash(s){ var x = 5381; for (var i = 0; i < s.length; i++) { x = ((x * 33) ^ s.codePointAt(i)) >>> 0; } return x.toString(36); }
function unlock() {
  document.getElementById("lock").hidden = true;
  document.getElementById("main").hidden = false;
  var d = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Shanghai" }));
  var week = ["日","一","二","三","四","五","六"];
  document.getElementById("today").textContent = (d.getMonth()+1) + "月" + d.getDate() + "日 星期" + week[d.getDay()] + " · 北京时间";
}
var saved = null;
try { saved = localStorage.getItem("mama-key"); } catch (e) {}
if (saved === KEY) { unlock(); }
function tryPw() {
  var pw = document.getElementById("pw");
  if (hash(pw.value.trim()) === KEY) {
    try { localStorage.setItem("mama-key", KEY); } catch (e) {}
    unlock();
  } else {
    pw.value = "";
    pw.classList.remove("shake");
    void pw.offsetWidth;
    pw.classList.add("shake");
  }
}
document.getElementById("go").addEventListener("click", tryPw);
document.getElementById("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") tryPw(); });
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
